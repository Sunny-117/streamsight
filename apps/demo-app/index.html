<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamSight 演示应用</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 10px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    
    .primary { background: #4CAF50; color: white; }
    .primary:hover { background: #45a049; }
    
    .secondary { background: #2196F3; color: white; }
    .secondary:hover { background: #1976D2; }
    
    .danger { background: #f44336; color: white; }
    .danger:hover { background: #d32f2f; }
    
    .warning { background: #ff9800; color: white; }
    .warning:hover { background: #f57c00; }
    
    .demo-section {
      margin: 30px 0;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f9f9f9;
    }
    
    .demo-section h3 {
      margin-top: 0;
      color: #333;
    }
    
    .form-group {
      margin: 15px 0;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    
    input, textarea, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .sensitive-data {
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
    }
    
    .oo-mask {
      background: #ffebee;
      padding: 2px 4px;
      border-radius: 3px;
    }
    
    .oo-block {
      background: #f3e5f5;
      padding: 10px;
      border-radius: 4px;
      border: 2px dashed #9c27b0;
    }
    
    .status {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 15px;
      border-radius: 5px;
      color: white;
      font-weight: bold;
      z-index: 1000;
    }
    
    .status.recording { background: #f44336; }
    .status.stopped { background: #4CAF50; }
    
    .interactive-elements {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    
    .clickable-box {
      padding: 20px;
      text-align: center;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .clickable-box:hover {
      border-color: #2196F3;
      background: #e3f2fd;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1001;
    }
    
    .modal-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      width: 90%;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎬 StreamSight 演示应用</h1>
    <p>用户行为录制与回放系统演示</p>
  </div>

  <div id="status" class="status stopped">录制已停止</div>

  <div class="controls">
    <button id="startBtn" class="primary">开始录制</button>
    <button id="stopBtn" class="secondary" disabled>停止录制</button>
    <button id="flushBtn" class="warning">刷新批次</button>
    <button id="viewReplaysBtn" class="secondary">查看回放</button>
  </div>

  <div class="demo-section">
    <h3>📝 表单交互测试</h3>
    <div class="form-group">
      <label for="username">用户名：</label>
      <input type="text" id="username" placeholder="请输入用户名">
    </div>
    
    <div class="form-group">
      <label for="email">邮箱（自动脱敏）：</label>
      <input type="email" id="email" placeholder="user@example.com">
    </div>
    
    <div class="form-group">
      <label for="password">密码（自动脱敏）：</label>
      <input type="password" id="password" placeholder="请输入密码">
    </div>
    
    <div class="form-group">
      <label for="creditCard">信用卡号（自动脱敏）：</label>
      <input type="text" id="creditCard" placeholder="4111-1111-1111-1111">
    </div>
    
    <div class="form-group">
      <label for="phone">手机号（自动脱敏）：</label>
      <input type="tel" id="phone" placeholder="13812345678">
    </div>
    
    <div class="form-group">
      <label for="sensitiveInfo" class="oo-mask">敏感信息（CSS 脱敏）：</label>
      <input type="text" id="sensitiveInfo" class="oo-mask" placeholder="这里的内容会被遮盖">
    </div>
    
    <div class="form-group">
      <label for="comments">备注：</label>
      <textarea id="comments" rows="3" placeholder="请输入备注信息"></textarea>
    </div>
    
    <div class="form-group">
      <label for="country">国家：</label>
      <select id="country">
        <option value="">请选择</option>
        <option value="cn">中国</option>
        <option value="us">美国</option>
        <option value="jp">日本</option>
      </select>
    </div>
  </div>

  <div class="demo-section">
    <h3>🎯 点击交互测试</h3>
    <div class="interactive-elements">
      <div class="clickable-box" data-action="click1">
        <h4>普通点击</h4>
        <p>点击计数: <span id="click1Count">0</span></p>
      </div>
      
      <div class="clickable-box" data-action="click2">
        <h4>双击测试</h4>
        <p>双击计数: <span id="click2Count">0</span></p>
      </div>
      
      <div class="clickable-box" data-action="hover">
        <h4>悬停效果</h4>
        <p>悬停次数: <span id="hoverCount">0</span></p>
      </div>
      
      <div class="clickable-box" data-action="modal">
        <h4>打开弹窗</h4>
        <p>测试模态框</p>
      </div>
    </div>
  </div>

  <div class="demo-section">
    <h3>🔒 隐私保护测试</h3>
    <div class="sensitive-data">
      <p>这是一些包含敏感信息的文本：</p>
      <p>邮箱: <span class="oo-mask">admin@company.com</span></p>
      <p>手机: <span class="oo-mask">13800138000</span></p>
      <p>信用卡: <span class="oo-mask">4111-1111-1111-1111</span></p>
    </div>
    
    <div class="oo-block">
      <h4>🚫 阻止采集区域</h4>
      <p>这个区域的内容不会被录制（使用 .oo-block 类）</p>
      <input type="text" placeholder="这里的输入不会被记录">
    </div>
  </div>

  <div class="demo-section">
    <h3>📊 动态内容测试</h3>
    <button id="addContentBtn" class="primary">添加动态内容</button>
    <button id="removeContentBtn" class="danger">移除内容</button>
    <div id="dynamicContent"></div>
  </div>

  <!-- 模态框 -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h3>测试弹窗</h3>
      <p>这是一个测试弹窗，用于验证模态框的录制效果。</p>
      <button id="closeModalBtn" class="secondary">关闭</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
